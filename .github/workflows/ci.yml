name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx -c requirements_dev.txt ruff check .
      - run: uvx -c requirements_dev.txt ruff format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install -r requirements_dev.txt
      - run: >-
          uv run pytest
          --cov=custom_components/kraftvakt
          --cov=simulator/custom_components/kraftvakt_simulator
          --cov-fail-under=100

  types:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install -r requirements_dev.txt
      - run: uv run mypy

  panel:
    name: Panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check that the committed bundle is up to date
        run: git diff --exit-code --stat -- ../custom_components/kraftvakt/frontend/
