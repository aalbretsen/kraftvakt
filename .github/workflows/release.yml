name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check-version:
    name: Check that the manifest version matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version custom_components/kraftvakt/manifest.json)
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match the manifest.json version $MANIFEST"
            exit 1
          fi
