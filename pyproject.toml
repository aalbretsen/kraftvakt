[project]
name = "kraftvakt"
version = "0.1.0"
description = "Home Assistant custom integration for prioritized power management under the Norwegian capacity tariff"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.2"

# No runtime dependencies; Home Assistant provides everything.
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The simulator is kept outside custom_components/, so HACS and hassfest never
# see it. On this path its integration joins the custom_components package.
pythonpath = ["simulator"]
