[project]
name = "kraftvakt"
version = "0.1.0"
description = "Home Assistant custom integration – prioritert effektstyring rettet mot kapasitetsleddet i nettleien"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14.2"

# Ingen runtime-avhengigheter – Home Assistant leverer alt.
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.kraftvakt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
